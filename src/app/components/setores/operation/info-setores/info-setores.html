<section class="container-operation-info">
  <div class="container-operation-info-separated">
    <mat-list>
      <mat-list-item>
        <span matListItemTitle>
          <p class="list-label">Id:</p>
          <p class="list-data">{{ info().id }}</p>
        </span>
      </mat-list-item>
      <mat-list-item>
        <span matListItemTitle>
          <p>Código:</p>
          <p>{{ info().codigo }}</p></span
        >
      </mat-list-item>
      <mat-list-item>
        <span matListItemTitle>
          <p>Descrição:</p>
          <p>{{ info().descricao }}</p></span
        >
      </mat-list-item>
      <mat-list-item>
        <span matListItemTitle>
          <p>Empresa Id:</p>
          <p>{{ info().empresa?.razaoSocial }}</p>
        </span>
      </mat-list-item>
      <mat-list-item>
        <span matListItemTitle>
          <p>Status:</p>
          <p>{{ info().status }}</p>
        </span>
      </mat-list-item>
    </mat-list>
  </div>
</section>
