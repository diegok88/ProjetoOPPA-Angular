<mat-list>
  <mat-list-item>
    <span matListItemTitle>
      <p class="list-label">Id:</p>
      <p class="list-data">{{ info().id }}</p>
    </span>
  </mat-list-item>
  <mat-list-item>
    <span matListItemTitle>
      <p class="list-label">Codigo:</p>
      <p class="list-data">{{ info().codigo }}</p>
    </span>
  </mat-list-item>
  <mat-list-item>
    <span matListItemTitle>
      <p class="list-label">Descrição:</p>
      <p class="list-data">{{ info().descricao }}</p>
    </span>
  </mat-list-item>
  <mat-list-item>
    <span matListItemTitle>
      <p class="list-label">Falha:</p>
      <p class="list-data">{{ info().falha?.codigo }} - {{ info().falha?.descricao }}</p>
    </span>
  </mat-list-item>
  <mat-list-item>
    <span matListItemTitle>
      <p class="list-label">Direcionamento:</p>
      <p class="list-data">{{ info().perfil?.descricao }} - {{ info().perfil?.nivel }}</p> 
    </span>
  </mat-list-item>
  <mat-list-item>
    <span matListItemTitle>
      <p class="list-label">Status:</p>
      <p class="list-data">{{ info().status ? 'Ativo' : 'Inativo' }}</p>
    </span>
  </mat-list-item>
</mat-list>
