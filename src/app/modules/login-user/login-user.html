<div class="default">
  <header class="default-header"></header>
  <main class="default-main">
    <section class="container-login">
      <section class="container-logo">
        <img class="logo" src="images/logoOPPA-2.png" alt="logo" />
      </section>
      <form class="container-form" (ngSubmit)="onSubmit($event)">
        <h2>Login</h2>
        <div class="group-form">
          <mat-form-field appearance="outline">
            <mat-label>Crachá</mat-label>
            <mat-icon matPrefix>badge</mat-icon>
            <!-- Icone do lado esquerdo -->
            <input
              matInput
              type="text"
              id="cracha"
              name="cracha"
              placeholder="Insira o seu crachá"
              [ngModel]="loginModel().cracha"
              (ngModelChange)="onInput('cracha', $event)"
              (blur)="onBlur('cracha')"
              inputmode="numeric"
              maxlength="5"
              autocomplete="off"
            />
            <mat-hint>
              <span class="error-message" [class.show]="badgeErrorNumber()"
                >Apenas números são permitidos</span
              >
              <span class="error-message" [class.show]="badgeEmptyFieldError()"
                >O crachá é obrigatório</span
              >
            </mat-hint>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Senha</mat-label>
            <mat-icon matPrefix>key</mat-icon>
            <input
              matInput
              [type]="hide() ? 'password' : 'text'"
              placeholder="Digite sua senha"
              id="senha"
              name="senha"
              placeholder="Insira a sua senha"
              [ngModel]="loginModel().senha"
              (ngModelChange)="onInput('senha', $event)"
              (blur)="onBlur('senha')"
              [class.error]="passwordEmptyFieldError()"
              autocomplete="new-password"
            />
            <button
              matIconButton
              matSuffix
              (click)="clickEvent($event)"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide()"
            >
              <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-hint>
              <span class="error-message" [class.show]="passwordEmptyFieldError()">
                A senha é obrigatória
              </span>
            </mat-hint>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Empresa</mat-label>
            <mat-icon matPrefix>badge</mat-icon>
            <!-- Icone do lado esquerdo -->
            <input
              matInput
              type="text"
              id="codEmpresa"
              name="codEmpresa"
              placeholder="Insira o código da empresa"
              [ngModel]="loginModel().codEmpresa"
              (ngModelChange)="onInput('codEmpresa', $event)"
              (blur)="onBlur('codEmpresa')"
              inputmode="numeric"
              maxlength="5"
              [class.error]="enterpriceErrorNumber() || enterpriceEmptyFieldError()"
              autocomplete="off"
            />
            <mat-hint>
              <span class="error-message" [class.show]="enterpriceErrorNumber()"
                >Apenas números são permitidos</span
              >
              <span class="error-message" [class.show]="enterpriceEmptyFieldError()"
                >O código da empresa é obrigatório</span
              >
            </mat-hint>
          </mat-form-field>
        </div>
        <div class="container-button">
          <button matButton="outlined" class="btn-enter" type="submit" [disabled]="formSubmitted()">
            Entrar
          </button>
          <button matButton="outlined">Pagina Inicial</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="default-footer">
    <section class="separate">
      <img class="icon-brand" src="icons/at.png" alt="@" />
      <p class="texto-footer">OPPA System. Todos os direitos reservados.</p>
    </section>
    <section class="separate">
      <img class="icon-social" src="icons/facebook.png" alt="facebook" />
      <img class="icon-social" src="icons/instagram.png" alt="instagram" />
      <img class="icon-social" src="icons/linkedin.png" alt="linkedin" />
    </section>
  </footer>
</div>
